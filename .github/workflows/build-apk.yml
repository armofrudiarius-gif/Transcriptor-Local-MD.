name: Build corrected offline Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract known-good v1.0 project
        run: |
          mkdir project
          tar -xJf source.tar.xz -C project
      - name: Apply v1.1 RO/RU corrections
        run: |
          cp v1.1/OfflineTranscriber.kt project/app/src/main/java/md/localtranscript/OfflineTranscriber.kt
          cp v1.1/prepare_offline_bundle.sh project/prepare_offline_bundle.sh
          cp v1.1/app-build.gradle.kts project/app/build.gradle.kts
          chmod +x project/prepare_offline_bundle.sh
      - name: Download pinned offline inference bundle
        run: cd project && ./prepare_offline_bundle.sh
      - name: Build debug APK
        run: cd project && gradle --no-daemon :app:assembleDebug
      - name: Verify no runtime network permission
        run: |
          ! grep -q 'android.permission.INTERNET' project/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' project/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Transcriptor-Local-MD-v1.1-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
