name: Build Transcriptor Local MD v3.0
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract known-good base project
        run: |
          mkdir project
          tar -xJf source.tar.xz -C project

      - name: Apply stable v1.2 and v2.0 source
        run: |
          cp v1.2/LocalLexicon.kt project/app/src/main/java/md/localtranscript/LocalLexicon.kt
          cp v2.0/OfflineTranscriber.kt project/app/src/main/java/md/localtranscript/OfflineTranscriber.kt
          cp v2.0/MainActivity.kt project/app/src/main/java/md/localtranscript/MainActivity.kt
          cp v2.0/TranscriptTypes.kt project/app/src/main/java/md/localtranscript/TranscriptTypes.kt
          cp v2.0/TranscriptQuality.kt project/app/src/main/java/md/localtranscript/TranscriptQuality.kt
          cp v2.0/TranscriptFormatter.kt project/app/src/main/java/md/localtranscript/TranscriptFormatter.kt
          cp v2.0/AudioEvidence.kt project/app/src/main/java/md/localtranscript/AudioEvidence.kt
          cp v2.0/CheckpointStore.kt project/app/src/main/java/md/localtranscript/CheckpointStore.kt
          cp v2.0/DocumentExporter.kt project/app/src/main/java/md/localtranscript/DocumentExporter.kt
          cp v1.1/prepare_offline_bundle.sh project/prepare_offline_bundle.sh
          chmod +x project/prepare_offline_bundle.sh

      - name: Apply v3.0 max-precision and dark UI source
        run: |
          cp v3.0/TranscriptTypes.kt project/app/src/main/java/md/localtranscript/TranscriptTypes.kt
          cp v3.0/app-build.gradle.kts project/app/build.gradle.kts
          cp v3.0/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
          mkdir -p project/app/src/main/res/values
          cp v3.0/styles.xml project/app/src/main/res/values/styles.xml
          python3 v3.0/patch_max_precision.py
          mkdir -p project/app/src/test/java/md/localtranscript
          cp v1.2/tests/*.kt project/app/src/test/java/md/localtranscript/
          cp v2.0/tests/*.kt project/app/src/test/java/md/localtranscript/
          cp v3.0/tests/*.kt project/app/src/test/java/md/localtranscript/

      - name: Verify v3 max-precision configuration and dark UI
        run: |
          grep -q 'duration <= 27.0f' project/app/src/main/java/md/localtranscript/OfflineTranscriber.kt
          grep -q 'TranscriptionProfile.ACCURACY -> 1000' project/app/src/main/java/md/localtranscript/OfflineTranscriber.kt
          grep -q '26f, 3.5f, 0.65f' project/app/src/main/java/md/localtranscript/TranscriptTypes.kt
          grep -q '#121212' project/app/src/main/res/values/styles.xml
          grep -q '#FFFFFF' project/app/src/main/res/values/styles.xml
          grep -q '@style/AppTheme' project/app/src/main/AndroidManifest.xml

      - name: Verify runtime source privacy policy
        run: |
          ! grep -R -n 'android.permission.INTERNET' project/app/src/main/AndroidManifest.xml
          ! grep -R -n 'android.permission.ACCESS_NETWORK_STATE' project/app/src/main/AndroidManifest.xml
          if grep -R -n -E 'OkHttp|Retrofit|HttpURLConnection|java\.net\.URL' project/app/src/main/java; then
            echo 'Runtime network-capable code detected' >&2
            exit 1
          fi

      - name: Download pinned offline inference bundle
        run: cd project && ./prepare_offline_bundle.sh

      - name: Run unit tests
        run: cd project && gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: cd project && gradle --no-daemon :app:assembleDebug

      - name: Verify compiled APK and permissions
        run: |
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee apk-permissions.txt
          "$AAPT" dump badging "$APK" | head -20 | tee apk-badging.txt
          ! grep -q 'android.permission.INTERNET' apk-permissions.txt
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' apk-permissions.txt
          grep -q 'android.permission.RECORD_AUDIO' apk-permissions.txt
          grep -q "versionName='3.0-max-precision'" apk-badging.txt

      - name: Prepare factual reports and release files
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk TranscriptorMD-v3.0-MaxPrecision.apk
          sha256sum TranscriptorMD-v3.0-MaxPrecision.apk | tee TranscriptorMD-v3.0-MaxPrecision.apk.sha256
          APK_SIZE=$(du -h TranscriptorMD-v3.0-MaxPrecision.apk | cut -f1)
          cat > TEST-REPORT-v3.0.md <<EOF
          # Test Report — Transcriptor Local MD v3.0

          CI run: ${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}

          - Max-precision configuration regression test: PASS
          - Kotlin/Android unit tests: PASS
          - Android debug APK compilation: PASS
          - Dark theme resource/manifest validation: PASS
          - AAPT package/version validation: PASS
          - Compiled APK permission check: PASS
          - INTERNET permission absent: PASS
          - ACCESS_NETWORK_STATE permission absent: PASS
          - RECORD_AUDIO permission present: PASS
          - APK size: ${APK_SIZE}

          Not executed in this CI runner and therefore not claimed as passed:
          - physical-device UI/runtime smoke test;
          - measured RO-MD/RU WER/CER;
          - long-duration thermal/RAM test;
          - direct Whisper Small vs Medium vs Qwen3-ASR benchmark on the same RO-MD dataset.
          EOF
          {
            echo '# Privacy Report — Transcriptor Local MD v3.0'
            echo
            echo 'Runtime source scan passed and the compiled APK manifest was inspected with AAPT.'
            echo
            echo '```text'
            cat apk-permissions.txt
            echo '```'
          } > PRIVACY-REPORT-v3.0.md
          ls -lh TranscriptorMD-v3.0-MaxPrecision.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.0 >/dev/null 2>&1 && gh release delete v3.0 -y --cleanup-tag || true
          gh release create v3.0 \
            TranscriptorMD-v3.0-MaxPrecision.apk \
            TranscriptorMD-v3.0-MaxPrecision.apk.sha256 \
            TEST-REPORT-v3.0.md \
            PRIVACY-REPORT-v3.0.md \
            MODEL-BENCHMARK-v3.0.md \
            CHANGELOG-v3.0.md \
            apk-permissions.txt \
            --title "Transcriptor Local MD v3.0 — Max Precision Dark" \
            --notes-file CHANGELOG-v3.0.md

      - uses: actions/upload-artifact@v4
        with:
          name: Transcriptor-Local-MD-v3.0-MaxPrecision
          path: |
            TranscriptorMD-v3.0-MaxPrecision.apk
            TranscriptorMD-v3.0-MaxPrecision.apk.sha256
            TEST-REPORT-v3.0.md
            PRIVACY-REPORT-v3.0.md
            MODEL-BENCHMARK-v3.0.md
            CHANGELOG-v3.0.md
            apk-permissions.txt
          if-no-files-found: error
