name: Build offline Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract corrected v1.1 project
        run: |
          base64 -d source-v1.1.tar.xz.b64 > source-v1.1.tar.xz
          mkdir project
          tar -xJf source-v1.1.tar.xz -C project
      - name: Download pinned offline inference bundle
        run: cd project && ./prepare_offline_bundle.sh
      - name: Build debug APK
        run: cd project && gradle --no-daemon :app:assembleDebug
      - name: Verify no runtime network permission
        run: |
          ! grep -q 'android.permission.INTERNET' project/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' project/app/src/main/AndroidManifest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Transcriptor-Local-MD-v1.1-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
